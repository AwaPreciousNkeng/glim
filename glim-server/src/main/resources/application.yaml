spring:
  application:
    name: glim-server

  datasource:
    url: jdbc:postgresql://localhost:5432/glim_db
    username: pcodes
    password: pcodes
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: pcodes
    password: pcodes
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:
            client-secret:
            scope:
              - email
              - profile
          facebook:
            client-id:
            client-secret:
            scope:
              - email
              - public_profile
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/css,text/plain,application/javascript
    min-response-size: 1024

